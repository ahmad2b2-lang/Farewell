<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Majlis">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2F5D50">
<meta name="color-scheme" content="only light">
<title>Majlis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EA; --surface:#FBFCF9; --ink:#1D2621; --muted:#5E6B63; --line:#CDD5C8;
  --primary:#2F5D50; --primary-ink:#FFFFFF; --accent:#D99A1E; --danger:#A23B2A;
  --light:#C98A12; --deep:#2F5D50; --memories:#8A5A3C; --whatif:#3E6A8A; --life:#6A7A28; --mine:#9A4E6E;
  color-scheme:only light;
}
*{box-sizing:border-box}
html,body{margin:0}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'Readex Pro',system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
/* app feel: no text selection or long-press menus on controls, no double-tap zoom */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-y:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,label,summary,a{touch-action:manipulation}
.btn:active,.chip:active,.friend:active,.wyr button:active,.seg button:active{transform:scale(.97)}
.btn,.chip,.friend,.wyr button,.seg button{transition:transform .08s}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 6px;display:flex;align-items:center;gap:8px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:1.75rem;font-weight:700;line-height:1.1;color:var(--primary);letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.hbtn{background:none;border:1px solid var(--line);border-radius:999px;min-height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:.9rem}
.hbtn.round{width:40px;padding:0;justify-content:center}

main{max-width:560px;margin:0 auto;padding:10px 16px calc(100px + env(safe-area-inset-bottom))}
.h{font-size:1.15rem;font-weight:600;margin:6px 0 10px}
h3{font-size:1rem;font-weight:600;margin:22px 0 8px}
.muted{color:var(--muted)}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:18px;margin:12px 0}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;min-height:48px;padding:10px 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent;font-weight:600}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.92rem}
.btn.grow{flex:1;white-space:nowrap}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.btn[aria-pressed="true"] svg{fill:currentColor}
.link{background:none;border:0;padding:8px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;color:var(--muted)}
.link.danger{color:var(--danger)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding-inline:0}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;min-height:40px;padding:6px 14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* the deck: the one bold element */
.stack{position:relative;margin:14px 6px 0}
.stack::before,.stack::after{content:"";position:absolute;inset:0;border-radius:24px;background:var(--surface);border:1px solid var(--line)}
.stack::before{transform:rotate(-3.2deg) translateY(8px)}
.stack::after{transform:rotate(2.2deg) translateY(4px)}
.card{position:relative;z-index:1;min-height:320px;border-radius:24px;background:var(--surface);border:1px solid var(--line);border-top:8px solid var(--mc);padding:20px 22px 18px;display:flex;flex-direction:column;touch-action:pan-y}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mood{color:var(--mc);font-weight:600;font-size:.95rem}
.usedtag{font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.q{flex:1;display:flex;align-items:center;margin:18px 0;font-size:clamp(1.45rem,6.4vw,1.9rem);line-height:1.32;font-weight:500;letter-spacing:-.005em;text-wrap:balance}
.card .hint{font-size:.82rem;color:var(--muted);margin:0}
.card.enter{animation:enter .28s ease-out}
@keyframes enter{from{opacity:0;transform:translateX(var(--from,28px)) rotate(1deg)}to{opacity:1;transform:none}}
[dir="rtl"] .card.enter{--from:-28px}
.actions{display:flex;gap:8px;margin-top:22px}
.actions .btn{white-space:nowrap;padding:10px 12px}
.actions .btn span{font-size:.92rem}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.9rem;margin-top:14px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;min-height:40px}
.toggle input{width:20px;height:20px;accent-color:var(--primary)}
details.addbox{margin-top:16px;border-top:1px solid var(--line);padding-top:6px}
details.addbox summary{cursor:pointer;padding:10px 0;font-weight:500;color:var(--primary)}

/* forms */
.field{display:block;margin:12px 0}
.field span{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=email],input[type=password],textarea{width:100%;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);resize:vertical}
form.inline{display:flex;flex-direction:column;gap:8px;margin-top:6px}

/* lists */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.friend{width:100%;text-align:start;display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:1.1rem;background:hsl(var(--h) 35% 85%);color:hsl(var(--h) 45% 25%);flex:none}
.f-main{min-width:0;display:flex;flex-direction:column}
.f-main small{color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px}

.plan li,.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;border-inline-start:5px solid var(--mc,var(--line))}
.plan li strong{display:block;font-size:.85rem;color:var(--muted);font-weight:500}
.starter{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.starter input{width:22px;height:22px;margin-top:2px;accent-color:var(--primary);flex:none}
.tag{display:inline-block;border-radius:999px;padding:4px 12px;background:var(--surface);border:1px solid var(--line);font-size:.9rem;margin:0 6px 6px 0}
.tag small{color:var(--muted)}
.plan-actions{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}

.story{display:flex;gap:10px;align-items:flex-start}
.story p{margin:0;flex:1;white-space:pre-wrap}
.story.done p{color:var(--muted)}
.story label{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);cursor:pointer}
.story input{width:20px;height:20px;accent-color:var(--primary)}
.story small{display:block;margin-top:4px;color:var(--muted);font-size:.8rem}
.signin{margin:6px 0 16px}
.signin .field:last-of-type{margin-bottom:16px}

/* games */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;min-height:42px;cursor:pointer;font-size:.9rem;padding:4px 6px}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);font-weight:600}
.gamecard{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px}
.wyr{display:flex;flex-direction:column;gap:10px}
.wyr button{border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:18px;font-size:1.15rem;font-weight:500;cursor:pointer;text-align:center}
.wyr button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--bg))}
.wyr .or{text-align:center;color:var(--muted);font-size:.9rem}
.big{font-size:1.4rem;line-height:1.35;font-weight:500;margin:0 0 18px}

/* tab bar */
.tabs{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs div{max-width:560px;margin:0 auto;display:flex}
.tabs button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--muted);padding:6px 2px;border-radius:12px;cursor:pointer;min-height:52px}
.tabs button[aria-current="page"]{color:var(--primary);font-weight:600}
.tabs button[aria-current="page"] svg{stroke-width:2.2}

/* sheet */
.sheet-wrap{position:fixed;inset:0;background:rgba(10,16,13,.45);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet-actions{display:flex;gap:8px;margin-top:16px}
.log{list-style:none;padding:0;margin:0}
.log>li{padding:10px 0;border-top:1px solid var(--line)}
.log ul{margin:4px 0 0;padding-inline-start:18px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.92rem;z-index:30;max-width:90vw;text-align:center}
.toast[hidden]{display:none}

/* PIN lock */
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
#lock[hidden]{display:none}
.update{position:fixed;inset-inline:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:40;max-width:528px;margin:0 auto;background:var(--primary);color:var(--primary-ink);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px}
.update[hidden]{display:none}
.update span{flex:1}
.update button{border:0;border-radius:12px;min-height:40px;padding:0 16px;background:var(--primary-ink);color:var(--primary);font-weight:600;cursor:pointer}
#lock h1{margin:0;font-size:2rem;font-weight:700;color:var(--primary)}
#lock p{margin:6px 0 0;color:var(--muted)}
.pin-dots{display:flex;gap:12px;height:18px;margin:28px 0 8px;align-items:center}
.pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--primary)}
.pin-dots span.on{background:var(--primary)}
.pin-dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#lock .pin-msg{min-height:1.5em;color:var(--danger);font-size:.92rem;margin:0 0 12px}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;direction:ltr}
.keypad button{height:76px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.6rem;font-weight:500;cursor:pointer;display:grid;place-items:center;touch-action:none;transition:background .1s,transform .08s}
.keypad button.down{background:var(--line);transform:scale(.94)}
#lock{touch-action:none}
.keypad button.go{background:var(--primary);color:var(--primary-ink);border-color:transparent;font-size:1rem;font-weight:600}
.keypad button:disabled{opacity:.5}
@media (prefers-reduced-motion:reduce){.pin-dots.shake{animation:none}}

@media (prefers-reduced-motion:reduce){.card.enter{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1 id="appName">Majlis</h1><p id="tagline"></p></div>
  <button class="hbtn" id="langBtn" type="button"></button>
  <button class="hbtn round" id="backupBtn" type="button"></button>
</header>
<div id="lock" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
  <h1 id="lockTitle">Majlis</h1>
  <p id="lockPrompt">Enter your PIN</p>
  <div class="pin-dots" id="pinDots" aria-hidden="true"></div>
  <p class="pin-msg" id="pinMsg" role="alert"></p>
  <div class="keypad" id="keypad"></div>
</div>
<main id="main"></main>
<nav class="tabs" aria-label="Sections"><div id="tabs"></div></nav>
<div class="toast" id="toast" role="status" hidden></div>
<div class="update" id="updateBar" role="status" hidden><span id="updateText"></span><button type="button" id="updateBtn"></button></div>
<div id="sheetRoot"></div>

<script>
const KEY='majlis.v1';

const TOPICS=[
 {id:'l1',m:'light',en:"What's the best thing you ate this month?",ar:'ما أفضل شيء أكلته هذا الشهر؟'},
 {id:'l2',m:'light',en:'Which app do you open the most, and is that a good thing?',ar:'ما التطبيق الذي تفتحه أكثر شيء؟ وهل هذا شيء جيد؟'},
 {id:'l3',m:'light',en:'If you could master one skill overnight, what would it be?',ar:'لو تقدر تتقن مهارة واحدة بين ليلة وضحاها، ماذا تختار؟'},
 {id:'l4',m:'light',en:'What small thing made you happy recently?',ar:'ما الشيء البسيط الذي أسعدك مؤخراً؟'},
 {id:'l5',m:'light',en:"What's the best thing you ever bought for under 100 riyals?",ar:'ما أفضل شيء اشتريته بأقل من 100 ريال؟'},
 {id:'l6',m:'light',en:'What habit did you pick up this year?',ar:'ما العادة التي اكتسبتها هذه السنة؟'},
 {id:'l7',m:'light',en:'Which place would you go back to tomorrow if you could?',ar:'أي مكان تتمنى ترجع له بكرة لو تقدر؟'},
 {id:'l8',m:'light',en:"What's your usual order at a café?",ar:'ما طلبك المعتاد في المقهى؟'},
 {id:'d1',m:'deep',en:'What have you changed your mind about in the last few years?',ar:'ما الشيء الذي غيّرت رأيك فيه في السنوات الأخيرة؟'},
 {id:'d2',m:'deep',en:'What advice would you give your 18-year-old self?',ar:'ما النصيحة التي تقدمها لنفسك وأنت في الثامنة عشرة؟'},
 {id:'d3',m:'deep',en:'Who had the biggest influence on how you think?',ar:'من أكثر شخص أثّر في طريقة تفكيرك؟'},
 {id:'d4',m:'deep',en:'What does a good day look like for you?',ar:'كيف يكون اليوم الجميل بالنسبة لك؟'},
 {id:'d5',m:'deep',en:'What are you working toward right now?',ar:'ما الهدف الذي تعمل عليه هذه الأيام؟'},
 {id:'d6',m:'deep',en:'What lesson did you learn the hard way?',ar:'ما الدرس الذي تعلمته بالطريقة الصعبة؟'},
 {id:'d7',m:'deep',en:'What do you want people to remember about you?',ar:'بماذا تحب أن يتذكرك الناس؟'},
 {id:'d8',m:'deep',en:"What are you grateful for that you rarely say out loud?",ar:'ما النعمة التي تشكر الله عليها ونادراً ما تذكرها؟'},
 {id:'m1',m:'memories',en:'What is the funniest thing that happened to us when we were younger?',ar:'ما أطرف موقف صار لنا ونحن صغار؟'},
 {id:'m2',m:'memories',en:'Which teacher do you still remember, and why?',ar:'أي معلم ما زلت تتذكره؟ ولماذا؟'},
 {id:'m3',m:'memories',en:'What was your favourite trip as a kid?',ar:'ما أجمل رحلة سافرتها وأنت صغير؟'},
 {id:'m4',m:'memories',en:'What smell or taste takes you straight back to childhood?',ar:'ما الرائحة أو الطعم الذي يرجعك فوراً للطفولة؟'},
 {id:'m5',m:'memories',en:'What was your first job, and what did it teach you?',ar:'ما أول عمل اشتغلته؟ وماذا تعلمت منه؟'},
 {id:'m6',m:'memories',en:'Which game did you play the most growing up?',ar:'ما اللعبة التي كنت تلعبها أكثر شيء وأنت صغير؟'},
 {id:'m7',m:'memories',en:'What Ramadan or Eid memory do you love?',ar:'ما أجمل ذكرى عندك من رمضان أو العيد؟'},
 {id:'m8',m:'memories',en:'Who was the troublemaker in our group back then?',ar:'من كان أكثر واحد مشاغب في شلتنا زمان؟'},
 {id:'w1',m:'whatif',en:'If you had a free year with no money worries, what would you do?',ar:'لو عندك سنة كاملة بدون همّ فلوس، ماذا تسوي؟'},
 {id:'w2',m:'whatif',en:'If you could start any business tomorrow, what would it be?',ar:'لو تقدر تبدأ أي مشروع بكرة، ماذا يكون؟'},
 {id:'w3',m:'whatif',en:'If you could live in any city for a year, where would you go?',ar:'لو تقدر تعيش سنة في أي مدينة، أين تختار؟'},
 {id:'w4',m:'whatif',en:'If you could ask one person from history a single question, who and what?',ar:'لو تقدر تسأل شخصية تاريخية سؤالاً واحداً، من تختار وماذا تسأل؟'},
 {id:'w5',m:'whatif',en:'If you swapped jobs with one of us for a week, who would you pick?',ar:'لو تبادلت عملك مع واحد منا لمدة أسبوع، من تختار؟'},
 {id:'w6',m:'whatif',en:'If you could add one thing to our city, what would it be?',ar:'لو تقدر تضيف شيئاً واحداً لمدينتنا، ماذا يكون؟'},
 {id:'w7',m:'whatif',en:'If you wrote a book, what would it be about?',ar:'لو كتبت كتاباً، عن ماذا يكون؟'},
 {id:'w8',m:'whatif',en:'If you could learn any language instantly, which one?',ar:'لو تقدر تتعلم أي لغة فوراً، أي لغة تختار؟'},
 {id:'c1',m:'life',en:"What's keeping you busy these days?",ar:'ما الذي يشغلك هذه الأيام؟'},
 {id:'c2',m:'life',en:"How's work going? Anything new?",ar:'كيف الشغل؟ فيه شيء جديد؟'},
 {id:'c3',m:'life',en:"How's the family doing?",ar:'كيف الأهل؟ عساهم بخير؟'},
 {id:'c4',m:'life',en:'What are you reading or watching lately?',ar:'ماذا تقرأ أو تتابع هذه الأيام؟'},
 {id:'c5',m:'life',en:'Any plans for the next weekend or holiday?',ar:'عندك خطط للإجازة القادمة؟'},
 {id:'c6',m:'life',en:"What's the best news you've had recently?",ar:'ما أحلى خبر سمعته مؤخراً؟'},
 {id:'c7',m:'life',en:'Is there anything you could use a hand with?',ar:'فيه شيء تحتاج مساعدة فيه؟'},
 {id:'c8',m:'life',en:'What are you looking forward to?',ar:'ما الشيء الذي تنتظره بشوق؟'}
];

const WYR=[
 {en:['Travel 100 years into the past','Travel 100 years into the future'],ar:['تسافر 100 سنة للماضي','تسافر 100 سنة للمستقبل']},
 {en:['Never use a phone again','Never drink coffee again'],ar:['تترك الجوال للأبد','تترك القهوة للأبد']},
 {en:['Live by the sea','Live in the mountains'],ar:['تعيش عند البحر','تعيش في الجبال']},
 {en:['Always be 10 minutes late','Always be 20 minutes early'],ar:['تتأخر دائماً 10 دقائق','تبكّر دائماً 20 دقيقة']},
 {en:['Speak every language','Talk to animals'],ar:['تتكلم كل لغات العالم','تتكلم مع الحيوانات']},
 {en:['A summer that never ends','A winter that never ends'],ar:['صيف لا ينتهي','شتاء لا ينتهي']},
 {en:['Read minds for a day','Be invisible for a day'],ar:['تقرأ الأفكار ليوم','تختفي عن الأنظار ليوم']},

/* ---------- state ---------- */
function blank(){return {lang:'en',used:{},saved:[],custom:[],friends:[],stories:[],cur:null,filter:'all',hideUsed:true,tab:'topics',plan:{friendIds:[]},game:{mode:'wyr',i:0,pick:null}}}
let S=blank();
/* PIN lock: the PIN is never stored. Only a PBKDF2 check value is here; the same derivation gives the key that encrypts this phone's data. */
const KEY_ENC='majlis.enc.v1', KEY_LANG='majlis.lang';
const PIN_SALT='12e0904f51d3dd269ea56dd1e44224df', PIN_ITER=400000, PIN_CHECK='a1e4ced0746444d21775fb3ebf51264076c3e5dea373e7d86aabd6933b88f07e';
let cryptoKey=null, saving=Promise.resolve();
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const b64=b=>btoa(String.fromCharCode(...b));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function save(){
  try{localStorage.setItem(KEY_LANG,S.lang)}catch(e){}
  if(!cryptoKey) return;
  const data=new TextEncoder().encode(JSON.stringify(S));
  saving=saving.then(async()=>{
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},cryptoKey,data));
    localStorage.setItem(KEY_ENC,JSON.stringify({iv:b64(iv),ct:b64(ct)}));
  }).catch(()=>{});
}
async function unlock(pin){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unhex(PIN_SALT),iterations:PIN_ITER},base,512));
  if(hex(bits.slice(0,32))!==PIN_CHECK) return 'wrong';
  const key=await crypto.subtle.importKey('raw',bits.slice(32),'AES-GCM',false,['encrypt','decrypt']);
  const enc=localStorage.getItem(KEY_ENC);
  if(enc){
    try{const o=JSON.parse(enc); const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct));
      S=Object.assign(blank(),JSON.parse(new TextDecoder().decode(pt)));}
    catch(e){return 'broken'}
  } else {
    const old=localStorage.getItem(KEY);   // notes saved before the PIN existed: move them into the locked store
    if(old){try{S=Object.assign(blank(),JSON.parse(old))}catch(e){}}
  }
  cryptoKey=key; save(); await saving;
  if(localStorage.getItem(KEY_ENC)) localStorage.removeItem(KEY);
  return 'ok';
}

/* ---------- supabase (stories only) ---------- */
const SB_URL='https://bhfgwlkzkbwcwyoypwhy.supabase.co', SB_KEY='sb_publishable_9YylflVQca-62NHsBKSTeA_GY896nj3';
let sb=null; try{ if(window.supabase&&window.supabase.createClient) sb=window.supabase.createClient(SB_URL,SB_KEY) }catch(e){}
let session=null, authReady=!sb, storiesBusy=false, storiesErr=false;
const rowToStory=r=>({id:r.id,text:r.text,shared:r.shared,at:Date.parse(r.created_at),remote:true});
async function syncStories(){
  if(!sb||!session||storiesBusy) return;
  storiesBusy=true; storiesErr=false;
  try{
    for(const st of S.stories.filter(x=>!x.remote)){
      const {data,error}=await sb.from('majlis_stories').insert({text:st.text,shared:!!st.shared,created_at:new Date(st.at||Date.now()).toISOString()}).select().single();
      if(error) throw error;
      const i=S.stories.indexOf(st); if(i>=0) S.stories[i]=rowToStory(data);
      if(S.plan.storyId===st.id) S.plan.storyId=data.id;
      save();
    }
    const {data,error}=await sb.from('majlis_stories').select('id,text,shared,created_at').order('created_at',{ascending:false});
    if(error) throw error;
    S.stories=data.map(rowToStory).concat(S.stories.filter(x=>!x.remote));
  }catch(e){storiesErr=true}
  storiesBusy=false; save(); if(S.tab==='stories') render();
}
async function remoteStory(op,st,fields){
  if(!st.remote||!sb||!session) return true;
  const q=sb.from('majlis_stories'); 
  const {error}=op==='delete'?await q.delete().eq('id',st.id):await q.update(fields).eq('id',st.id);
  if(error){toast(t('syncFail')); return false}
  return true;
}
function startAuth(){
  if(!sb) return;
  sb.auth.onAuthStateChange((ev,s)=>{
    session=s; authReady=true;
    if(ev==='SIGNED_OUT'){S.stories=S.stories.filter(x=>!x.remote); save()}
    if(S.tab==='stories') render();
    if(s&&(ev==='INITIAL_SESSION'||ev==='SIGNED_IN')) setTimeout(syncStories,0);
  });
}

/* ---------- topics ---------- */
function deckPool(){
  let p=allTopics();
  if(S.filter==='saved') p=p.filter(x=>S.saved.includes(x.id));
  else if(S.filter!=='all') p=p.filter(x=>x.m===S.filter);
  if(S.hideUsed) p=p.filter(x=>!S.used[x.id]);
  return p;
}
function nextTopic(){
  const p=deckPool(); if(!p.length){S.cur=null;return}
  let c=p.filter(x=>x.id!==S.cur&&!recent.includes(x.id));
  if(!c.length) c=p.filter(x=>x.id!==S.cur);
  if(!c.length) c=p;
  const n=rand(c); S.cur=n.id; recent.push(n.id);
  while(recent.length>Math.max(1,Math.min(6,Math.floor(p.length/2)))) recent.shift();
  animateCard=true;
}
function renderTopics(){
  const pool=deckPool();
  if(!S.cur||!pool.some(x=>x.id===S.cur)) nextTopic();
  const cur=S.cur?topicById(S.cur):null;
  const filters=['all',...MOODS]; if(S.custom.length) filters.push('mine'); if(S.saved.length) filters.push('saved');
  if(!filters.includes(S.filter)) S.filter='all';
  const total=allTopics().length, usedN=allTopics().filter(x=>S.used[x.id]).length;
  let h='<div class="chips" role="group">'+filters.map(f=>{
    const dot=(f!=='all'&&f!=='saved')?'<span class="dot"></span>':'';
    return `<button class="chip" type="button" data-filter="${f}" aria-pressed="${S.filter===f}" style="--c:var(--${f})">${dot}${esc(t(f))}</button>`}).join('')+'</div>';
  if(cur){
    const isSaved=S.saved.includes(cur.id), isUsed=!!S.used[cur.id];
    h+=`<div class="stack"><article class="card${animateCard?' enter':''}" id="card" style="--mc:var(--${cur.m})" aria-live="polite">
      <div class="card-head"><span class="mood">${esc(t(cur.m))}</span>${isUsed?`<span class="usedtag">${esc(t('used'))}</span>`:''}</div>
      <p class="q" dir="auto">${esc(txt(cur))}</p>
      <div class="row-between"><p class="hint">${esc(t('swipeHint'))}</p>${cur.m==='mine'?`<button class="link danger" type="button" data-act="delTopic">${esc(t('delete'))}</button>`:''}</div>
    </article></div>
    <div class="actions">
      <button class="btn" type="button" data-act="save" aria-pressed="${isSaved}">${ICON.star}<span>${esc(t('save'))}</span></button>
      <button class="btn" type="button" data-act="used" aria-pressed="${isUsed}">${ICON.check}<span>${esc(t('usedIt'))}</span></button>
      <button class="btn primary grow" type="button" data-act="next">${esc(t('another'))}</button>
    </div>`;
  } else h+=`<p class="empty">${esc(t('noTopics'))}</p>`;
  animateCard=false;
  h+=`<div class="meta"><label class="toggle"><input type="checkbox" id="hideUsed" ${S.hideUsed?'checked':''}>${esc(t('hideUsed'))}</label><span>${usedN} / ${total} ${esc(t('used'))}</span></div>`;
  if(usedN) h+=`<button class="link" type="button" data-act="clearUsed">${esc(t('clearUsed'))}</button>`;
  h+=`<details class="addbox"><summary>${esc(t('addTopic'))}</summary>
    <form class="inline" id="topicForm"><textarea id="topicText" rows="2" dir="auto" placeholder="${esc(t('addTopicPh'))}" required></textarea>
    <button class="btn primary" type="submit">${esc(t('add'))}</button></form></details>`;
  return h;
}

function field(key,kind,val,ph,req){
  const p=ph?` placeholder="${esc(t(ph))}"`:'';

/* ---------- meetup ---------- */
function buildPlan(){
  const p=S.plan, sel=S.friends.filter(f=>p.friendIds.includes(f.id));
  const usedWith=new Set(); sel.forEach(f=>Object.keys(f.used||{}).forEach(id=>usedWith.add(id)));
  const pool=allTopics().filter(x=>!usedWith.has(x.id));
  p.topicIds=[]; ['life','light','memories','whatif','deep','mine'].forEach(m=>{const c=pool.filter(x=>x.m===m); if(c.length) p.topicIds.push(rand(c).id)});
  const st=S.stories.filter(s=>!s.shared); p.storyId=st.length?rand(st).id:null;
  p.game=Math.random()<.6?{mode:'wyr',i:Math.floor(Math.random()*WYR.length)}:{mode:'debate',i:Math.floor(Math.random()*DEBATE.length)};
}
function renderMeetup(){
  let h=`<h2 class="h">${esc(t('meetupIntro'))}</h2>`;
  if(!S.friends.length) return h+`<p class="empty">${esc(t('noFriendsYet'))}</p><button class="btn primary" type="button" data-goto="friends">${esc(t('goFriends'))}</button>`;
  const p=S.plan; p.friendIds=p.friendIds.filter(id=>S.friends.some(f=>f.id===id));
  h+='<div class="chips wrap" role="group">'+[...S.friends].sort((a,b)=>a.name.localeCompare(b.name)).map(f=>
    `<button class="chip" type="button" data-pick="${f.id}" aria-pressed="${p.friendIds.includes(f.id)}" dir="auto">${esc(f.name)}</button>`).join('')+'</div>';
  const sel=S.friends.filter(f=>p.friendIds.includes(f.id));
  if(!sel.length) return h+`<p class="empty">${esc(t('pickFriends'))}</p>`;
  if(!p.topicIds) buildPlan();

  const asks=[];
  sel.forEach(f=>{ if(f.news&&f.news.trim()) asks.push([f.name,f.news.trim()]); lines(f.followups).forEach(q=>asks.push([f.name,q])) });
  if(asks.length) h+=`<h3>${esc(t('askAbout'))}</h3><ul class="list plan">`+asks.map(a=>`<li><strong dir="auto">${esc(a[0])}</strong><span dir="auto">${esc(a[1])}</span></li>`).join('')+'</ul>';

  const map=new Map();
  sel.forEach(f=>(f.interests||'').split(/[,،]/).map(s=>s.trim()).filter(Boolean).forEach(i=>{
    const k=i.toLowerCase(); if(!map.has(k)) map.set(k,{label:i,names:new Set()}); map.get(k).names.add(f.name)}));
  let interests=[...map.values()];
  if(sel.length>1) interests=interests.filter(x=>x.names.size>1);
  if(interests.length){
    h+=`<h3>${esc(t(sel.length>1?'commonGround':'theirInterests'))}</h3><div>`+interests.map(x=>
      `<span class="tag" dir="auto">${esc(x.label)}${sel.length>2?` <small>${esc([...x.names].join(', '))}</small>`:''}</span>`).join('')+'</div>';
  }

  const tops=(p.topicIds||[]).map(topicById).filter(Boolean);
  h+=`<h3>${esc(t('starters'))}</h3>`;
  if(tops.length){
    h+=`<p class="muted" style="margin:0 0 8px;font-size:.9rem">${esc(t('tickHint'))}</p><ul class="list plan" id="starters">`+tops.map(tp=>
      `<li style="--mc:var(--${tp.m})"><label class="starter"><input type="checkbox" value="${tp.id}" checked><span dir="auto">${esc(txt(tp))}</span></label></li>`).join('')+'</ul>';
  } else h+=`<p class="empty">${esc(t('noStarters'))}</p>`;

  const story=p.storyId&&S.stories.find(s=>s.id===p.storyId);
  if(story) h+=`<h3>${esc(t('storyToShare'))}</h3><div class="item" dir="auto">${esc(story.text)}</div>`;

  if(p.game){
    const g=p.game.mode==='wyr'?WYR[p.game.i]:DEBATE[p.game.i];
    if(g){
      const body=p.game.mode==='wyr'?`${esc(t('wyr'))}: ${esc(g[S.lang][0])} ${esc(t('or'))} ${esc(S.lang==='en'?g.en[1][0].toLowerCase()+g.en[1].slice(1):g.ar[1])}${S.lang==='ar'?'؟':'?'}`:esc(g[S.lang]);
      h+=`<h3>${esc(t('gameIdea'))}</h3><div class="item">${body}</div>`;
    }
  }
  h+=`<div class="plan-actions"><button class="btn" type="button" data-act="shuffle">${esc(t('shuffle'))}</button><button class="btn primary grow" type="button" data-act="saveMeetup">${esc(t('weMet'))}</button></div>`;
  return h;
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-filter],[data-friend],[data-pick],[data-goto],[data-delstory],[data-mode],[data-wyr]');
  if(!el) return;
  const d=el.dataset;
  if(d.act==='closeSheet'){ if(el.classList.contains('sheet-wrap')&&e.target!==el) return; closeSheet(); return }
  if(d.filter){S.filter=d.filter; S.cur=null; render(); return}
  if(d.friend){openFriend(d.friend); return}
  if(d.goto){S.tab=d.goto; render(); return}
  if(d.pick){
    const ids=S.plan.friendIds; const i=ids.indexOf(d.pick); i<0?ids.push(d.pick):ids.splice(i,1);
    buildPlan(); render(); return}
  if(d.delstory){const st=S.stories.find(s=>s.id===d.delstory); if(!st||!confirm(t('confirmDelStory'))) return;
    remoteStory('delete',st).then(ok=>{if(ok){S.stories=S.stories.filter(s=>s!==st); render()}}); return}
  if(d.mode){S.game={mode:d.mode,i:Math.floor(Math.random()*(d.mode==='wyr'?WYR.length:DEBATE.length)),pick:null}; render(); return}
  if(d.wyr){S.game.pick=S.game.pick===+d.wyr?null:+d.wyr; render(); return}
  switch(d.act){
    case 'next': nextTopic(); render(); break;
    case 'save': {const i=S.saved.indexOf(S.cur); i<0?S.saved.push(S.cur):S.saved.splice(i,1); render(); break}
    case 'used': {if(S.used[S.cur]) delete S.used[S.cur]; else S.used[S.cur]=today(); render(); break}
    case 'clearUsed': if(confirm(t('clearUsedQ'))){S.used={}; render()} break;
    case 'delTopic': {const id=S.cur; S.custom=S.custom.filter(c=>c.id!==id); S.saved=S.saved.filter(x=>x!==id); delete S.used[id]; S.cur=null; render(); break}
    case 'addFriend': openFriend(null); break;
    case 'delFriend': if(confirm(t('confirmDelete'))){S.friends=S.friends.filter(f=>f.id!==d.id); closeSheet(); render()} break;
    case 'shuffle': buildPlan(); render(); break;
    case 'saveMeetup': {
      const p=S.plan, sel=S.friends.filter(f=>p.friendIds.includes(f.id)), dt=today();
      const done=[...document.querySelectorAll('#starters input:checked')].map(i=>i.value);
      sel.forEach(f=>{f.used=f.used||{}; done.forEach(id=>f.used[id]=dt); f.log=f.log||[]; f.log.unshift({d:dt,t:done}); f.lastMet=dt});
      done.forEach(id=>{if(!S.used[id]) S.used[id]=dt});
      const st=p.storyId&&S.stories.find(s=>s.id===p.storyId); if(st){st.shared=true; remoteStory('update',st,{shared:true})}
      S.plan={friendIds:[]}; render(); toast(t('metSaved')); window.scrollTo(0,0); break}
    case 'resync': syncStories(); break;
    case 'signOut': if(sb) sb.auth.signOut(); break;
    case 'nextGame': {const n=S.game.mode==='wyr'?WYR.length:DEBATE.length; S.game.i=(S.game.i+1)%n; S.game.pick=null; render(); break}
    case 'export': {
      const blob=new Blob([JSON.stringify({app:'majlis',v:1,data:S},null,2)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='majlis-backup-'+today()+'.json';
      document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove()},500); break}
  }
});

/* ---------- lock screen ---------- */
(function(){
  try{const l=localStorage.getItem(KEY_LANG); if(l==='ar'||l==='en') S.lang=l}catch(e){}
  document.documentElement.lang=S.lang; document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
  const lock=document.getElementById('lock'), dots=document.getElementById('pinDots'), msg=document.getElementById('pinMsg'), pad=document.getElementById('keypad');
  document.getElementById('lockTitle').textContent=t('app');
  document.getElementById('lockPrompt').textContent=t('enterPin');
  let pin='', busy=false, fails=0, waitUntil=0;
  pad.innerHTML=['1','2','3','4','5','6','7','8','9','del','0','go'].map(k=>
    k==='del'?`<button type="button" data-k="del" aria-label="${esc(t('delDigit'))}">⌫</button>`:
    k==='go'?`<button type="button" class="go" data-k="go">${esc(t('unlockBtn'))}</button>`:
    `<button type="button" data-k="${k}">${k}</button>`).join('');
  const drawDots=()=>{dots.innerHTML=[...Array(Math.max(pin.length,4))].map((_,i)=>`<span class="${i<pin.length?'on':''}"></span>`).join('')};
  drawDots();
  async function go(){
    if(busy||!pin) return;
    if(Date.now()<waitUntil){msg.textContent=t('waitPin'); return}
    busy=true; msg.textContent=t('checking'); msg.style.color='var(--muted)';
    pad.querySelectorAll('button').forEach(b=>b.disabled=true);
    let r='wrong'; try{r=await unlock(pin)}catch(e){}
    pad.querySelectorAll('button').forEach(b=>b.disabled=false); busy=false; msg.style.color='';
    if(r==='ok'){lock.hidden=true; pin=''; msg.textContent=''; render(); startAuth(); return}
    if(r==='broken'){msg.textContent=t('brokenData'); return}
    fails++; pin=''; drawDots();
    dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
    if(fails>=5){waitUntil=Date.now()+30000; fails=0; msg.textContent=t('waitPin')} else msg.textContent=t('wrongPin');
  }
  function press(k){
    if(busy) return;
    if(k==='go') return go();
    if(k==='del') pin=pin.slice(0,-1); else if(pin.length<12) pin+=k;
    msg.textContent=''; drawDots();
  }
  pad.addEventListener('pointerdown',e=>{
    const b=e.target.closest('[data-k]'); if(!b||b.disabled) return;
    e.preventDefault(); b.classList.add('down'); setTimeout(()=>b.classList.remove('down'),120);
    if(navigator.vibrate) try{navigator.vibrate(8)}catch(err){}
    press(b.dataset.k);
  });
  pad.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('keydown',e=>{
    if(lock.hidden) return;
    if(/^[0-9]$/.test(e.key)) press(e.key); else if(e.key==='Backspace') press('del'); else if(e.key==='Enter') press('go');
  });
  // lock again after 5 minutes in the background
  let hiddenAt=0;
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden) hiddenAt=Date.now();
    else if(cryptoKey&&hiddenAt&&Date.now()-hiddenAt>5*60*1000) location.reload();
    else if(hiddenAt&&Date.now()-hiddenAt>60*1000) checkForUpdate();
  });
  checkForUpdate();
})();

/* ---------- always run the newest version ----------
   On open (and when coming back to the app) download the page fresh from GitHub and compare it
   with the copy the browser has. If they differ, refresh the browser's copy and reload. */
async function checkForUpdate(){
  if(!/^https?:/.test(location.protocol)) return;
  try{
    const page=location.pathname;
    const fresh=await fetch(page+'?u='+Date.now(),{cache:'no-store'});
    if(!fresh.ok) return;
    const freshText=await fresh.text();
    const cached=await fetch(page,{cache:'force-cache'});
    if(!cached.ok||freshText===await cached.text()) return;
    await fetch(page,{cache:'reload'});          // replace the browser's stored copy with the new one
    let last=0; try{last=+sessionStorage.getItem('majlis.updated')||0}catch(e){}
    if(Date.now()-last<30000) return;           // just reloaded for an update: don't loop
    try{sessionStorage.setItem('majlis.updated',String(Date.now()))}catch(e){}
    if(!cryptoKey){location.reload(); return}   // still on the PIN screen: nothing to lose, reload now
    const bar=document.getElementById('updateBar');
    document.getElementById('updateText').textContent=t('newVersion');
    const btn=document.getElementById('updateBtn'); btn.textContent=t('reloadNow');
    btn.onclick=()=>{save(); saving.then(()=>location.reload())};
    bar.hidden=false;
  }catch(e){}
}
</script>
</body>
</html>
